stages:
  - validate
  - secret_scan
  - test 
  - sonarqube
  - dependency_scan
  - trivy_fs_scan
  - docker_build
  - trivy_image_scan
  - docker_push
  - update_manifests

variables:
  IMAGE_FRONTEND: "voteapp-frontend-react"
  IMAGE_BACKEND: "voteapp-api-go"


validate:
  stage: validate
  script:
    # delete the above one
    - echo "Starting Pipeline"
    - echo "Branch $CI_COMMIT_REF_NAME"
    - echo "Commit $CI_COMMIT_SHORT_SHA"
    - echo "Pipeline $CI_PIPELINE_IID"


secret_scan:
  stage: secret_scan
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks version
    - gitleaks detect --source . --verbose --redact

test:
    stage: test
    script:
    - echo "The developer hasn't written test case for this Project"

sonarqube:
  stage: sonarqube

  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"

  cache:
    key: "sonar-cache-${CI_PROJECT_ID}"
    paths:
      - "${SONAR_USER_HOME}/cache"
    policy: pull-push

  script:
    - sonar-scanner
        -Dsonar.host.url="${SONAR_HOST_URL}"
        -Dsonar.qualitygate.wait=true

  allow_failure: false

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

dependency_scan:
  stage: dependency_scan
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]

  script:
    - /usr/share/dependency-check/bin/dependency-check.sh
        --project "Voting-App-K8s"
        --scan "$CI_PROJECT_DIR/voteapp-frontend-react"
        --scan "$CI_PROJECT_DIR/voteapp-api-go"
        --format HTML
        --out "$CI_PROJECT_DIR/dependency-check-report"
        --nvdApiKey "$NVD_API_KEY"
        --failOnCVSS 7

  artifacts:
    when: always
    paths:
      - dependency-check-report/


trivy_fs_scan:
    stage: trivy_fs_scan
    image:
      name: aquasec/trivy:latest
      entrypoint: [""]

    script:
    - trivy fs --scanners vuln,secret --exit-code 0 . 
  #the Project has a lot of Vulnerabilities so I deliberately made by --exit-code 0 from 1 to pass the pipeline. 
  #It is highly recommended to keep it 1 and resolve the vulnerabilities in the code section.

docker_build:
  stage: docker_build

  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  
  script:
    - docker version
    - cd voteapp-api-go
    - docker build -t "$DOCKER_HUB_USERNAME/${IMAGE_BACKEND}:v${CI_PIPELINE_IID}" .
    - docker save "$DOCKER_HUB_USERNAME/${IMAGE_BACKEND}:v${CI_PIPELINE_IID}" -o ../backend-image.tar
    - cd ../voteapp-frontend-react
    - docker build -t "$DOCKER_HUB_USERNAME/${IMAGE_FRONTEND}:v${CI_PIPELINE_IID}" .
    - docker save "$DOCKER_HUB_USERNAME/${IMAGE_FRONTEND}:v${CI_PIPELINE_IID}" -o ../frontend-image.tar
  artifacts:
    paths:
      - backend-image.tar
      - frontend-image.tar
    expire_in: 1 hour


trivy_image_scan:
  stage: trivy_image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - job: docker_build
      artifacts: true
  script:
    - trivy image --input backend-image.tar --severity HIGH,CRITICAL --exit-code 0 --no-progress
    - trivy image --input frontend-image.tar --severity HIGH,CRITICAL --exit-code 0 --no-progress

docker_push:
  stage: docker_push
  image: docker:27

  services:
    - name: docker:27-dind
      alias: docker-push

  variables:
    DOCKER_HOST: tcp://docker-push:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: docker_build
      artifacts: true

  script:
    - docker version
    - docker load -i backend-image.tar
    - docker load -i frontend-image.tar
    - echo "$DOCKER_HUB_PASSWD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - docker push "$DOCKER_HUB_USERNAME/$IMAGE_BACKEND:v${CI_PIPELINE_IID}"
    - docker push "$DOCKER_HUB_USERNAME/$IMAGE_FRONTEND:v${CI_PIPELINE_IID}"
    - docker logout

update-docker-compose-yml:
  stage: update_manifests
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - git clone "https://${MANIFEST_USER}:${MANIFEST_TOKEN}@github.com/OzairKhan1/Kubernetes-ManifestFiles.git"
    - cd Kubernetes-ManifestFiles
    - |
      sed -i "s#image: ${DOCKER_HUB_USERNAME}/${IMAGE}:.*#image: $DOCKER_HUB_USERNAME/$IMAGE_FRONTEND:v${CI_PIPELINE_IID}#g" \
        votingApp-manifestFiles/frontend-dep.yml
    - |
       sed -i "s#image: ${DOCKER_HUB_USERNAME}/${IMAGE}:.*#image: $DOCKER_HUB_USERNAME/$IMAGE_BACKEND:v${CI_PIPELINE_IID}#g" \
        votingApp-manifestFiles/api-dep.yml
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@example.com"
    - git add votingApp-manifestFiles/frontend-dep.yml
    - git add votingApp-manifestFiles/api-dep.yml
    - git commit -m "Update image to version ${CI_PIPELINE_IID}" || echo "No changes to commit"
    - git push origin main
    - echo "The GitHub repository was successfully updated!"




