apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voting-app-ns
  labels:
    role: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
    spec:
      containers:
      - name: frontend
        image: ozairkhan1/voteapp-frontend-react:v16
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: env-config
          mountPath: /usr/share/nginx/html/env-config.js
          subPath: env-config.js
          readOnly: true
        livenessProbe:
          httpGet:
            path: /ok
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /ok
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
      volumes:
      - name: env-config
        configMap:
          name: frontend-env
