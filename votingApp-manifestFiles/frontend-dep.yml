apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: voting-app-ns
  labels:
    role: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
    spec:
      containers:
      - name: frontend
        image: ozairkhan1/voteapp-frontend-react:v11
        imagePullPolicy: Always
        env:
          - name: REACT_APP_APIHOSTPORT
            value: "https://6ad4e3973505a3f5e8118787-4c2949.node-eu-13e2.iximiuz.com"   #add your API_Load_Balancer DNS manually here if app does not run
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /ok
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        readinessProbe:
          httpGet:
             path: /ok
             port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
